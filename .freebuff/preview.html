<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS SaaS - Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e; color: #eee; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card {
            background: #16213e; border-radius: 16px; padding: 48px;
            max-width: 520px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 { font-size: 28px; margin-bottom: 8px; color: #e94560; }
        .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
        .status { 
            display: inline-flex; align-items: center; gap: 8px;
            background: #0f3460; padding: 10px 20px; border-radius: 8px;
            font-size: 14px; margin-bottom: 24px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
        .dot.off { background: #ef4444; }
        a.btn {
            display: inline-block; padding: 14px 32px; background: #e94560;
            color: #fff; text-decoration: none; border-radius: 8px;
            font-weight: 600; font-size: 16px; transition: background 0.2s;
        }
        a.btn:hover { background: #c73e54; }
        .ports { margin-top: 24px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏪 POS SaaS</h1>
        <p class="subtitle">Migration vers plateforme multi-entreprises</p>
        <div class="status" id="status">
            <div class="dot off" id="dot"></div>
            <span id="status-text">Vérification du serveur…</span>
        </div>
        <br>
        <a class="btn" href="http://127.0.0.1:8000/" target="_blank">Ouvrir l'application →</a>
        <div class="ports">
            <p>Backend Laravel : <strong>127.0.0.1:8000</strong></p>
            <p>Vite HMR : <strong>127.0.0.1:5173</strong></p>
        </div>
    </div>
    <script>
        fetch('http://127.0.0.1:8000/')
            .then(r => { 
                document.getElementById('dot').className = 'dot';
                document.getElementById('status-text').textContent = 'Serveur Laravel actif ✓';
            })
            .catch(() => {
                document.getElementById('dot').className = 'dot off';
                document.getElementById('status-text').textContent = 'Serveur Laravel introuvable';
            });
    </script>
</body>
</html>
