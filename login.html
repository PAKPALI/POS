    <script>
        $(function() {
            $('#loader').hide();

            //ajax pour se connecter
            $('#form_login').submit(function(){
                event.preventDefault();
                $('#submitText').hide();
                $('#loader').fadeIn();
                $.ajax({
                    type: 'POST',
                    url: "http://127.0.0.1:8011/login",
                    data: $('#form_login').serialize(),
                    datatype: 'json',
                    success: function (data){
                        console.log(data)
                        if (data.status) {
                            $('#form_login').slideUp(3000);
                            // Swal.fire({
                            //     icon: "success",
                            //     title: data.title,
                            //     text: data.msg,
                            // }).then(() => {
                            //     if (data.redirect_to != null){
                            //         window.location.assign(data.redirect_to);
                            //     }
                            // });
                            Swal.fire({
                                toast: true,
                                position: 'top',
                                icon: "success",
                                title: data.title,
                                showConfirmButton: false,
                                timer: 3000,
                                timerProgressBar: true,
                                text: data.msg,
                                didClose: () => {
                                    // Redirection vers une route après la fermeture de l'alerte
                                    window.location.assign(data.redirect_to);
                                }
                            });
                        } else {
                            $('#loader').hide();
                            $('#submitText').show();
                            Swal.fire({
                                title: data.title,
                                text:data.msg,
                                icon: 'error',
                                confirmButtonText: "D'accord",
                                confirmButtonColor: 'red',
                            });
                        }
                    },
                    error: function (data){
                        $('#loader').hide();
                        $('#submitText').show();
                        Swal.fire({
                            icon: "error",
                            title: "Erreur",
                            text: "Impossible de communiquer avec le serveur.",
                            timer: 3600,
                        });
                    }
                });
                return false;
            });

            $('#togglePassword').on('click', function() {
                const passwordField = document.getElementById("password");
                const toggleIcon = document.getElementById("togglePasswordIcon");

                if (passwordField.type === "password") {
                    passwordField.type = "text";
                    toggleIcon.classList.remove("bi-eye");
                    toggleIcon.classList.add("bi-eye-slash");
                } else {
                    passwordField.type = "password";
                    toggleIcon.classList.remove("bi-eye-slash");
                    toggleIcon.classList.add("bi-eye");
                }
            });
            $('#togglePassword2').on('click', function() {
                const passwordField = document.getElementById("password2");
                const toggleIcon = document.getElementById("togglePasswordIcon2");

                if (passwordField.type === "password") {
                    passwordField.type = "text";
                    toggleIcon.classList.remove("bi-eye");
                    toggleIcon.classList.add("bi-eye-slash");
                } else {
                    passwordField.type = "password";
                    toggleIcon.classList.remove("bi-eye-slash");
                    toggleIcon.classList.add("bi-eye");
                }
            });
        });
    </script>
