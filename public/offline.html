<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#082B59">
    <link rel="icon" type="image/svg+xml" href="/brand/maxanou-symbol.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
    <title>Connexion indisponible — MAXANOU</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f1115; color: #eef1f5; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(100%, 480px); padding: 36px; text-align: center; background: #191d24; border: 1px solid #343b47; border-radius: 20px; box-shadow: 0 22px 55px rgba(0, 0, 0, .35); }
        .logo { display: block; width: 82px; height: 82px; margin: 0 auto 22px; padding: 9px; border-radius: 22px; background: #082B59; object-fit: contain; }
        h1 { margin: 0 0 12px; font-size: 25px; }
        p { margin: 0 0 26px; color: #b8c0cc; line-height: 1.6; }
        button { border: 0; border-radius: 12px; padding: 13px 22px; background: #1677FF; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:focus-visible { outline: 3px solid #86B8FF; outline-offset: 3px; }
    </style>
</head>
<body>
<main>
    <img class="logo" src="/brand/maxanou-symbol-light.svg" alt="Maxanou">
    <h1>Vous êtes hors connexion</h1>
    <p>MAXANOU ne peut pas joindre le serveur. Vérifiez votre connexion Internet, puis réessayez. Aucune donnée d’entreprise n’a été enregistrée sur cet appareil.</p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
</main>
</body>
</html>
