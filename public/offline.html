<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>Connexion indisponible — PRO-SELLER</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f1115; color: #eef1f5; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(100%, 480px); padding: 36px; text-align: center; background: #191d24; border: 1px solid #343b47; border-radius: 20px; box-shadow: 0 22px 55px rgba(0, 0, 0, .35); }
        .icon { display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 22px; background: #252b35; font-size: 36px; }
        h1 { margin: 0 0 12px; font-size: 25px; }
        p { margin: 0 0 26px; color: #b8c0cc; line-height: 1.6; }
        button { border: 0; border-radius: 12px; padding: 13px 22px; background: #22a06b; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:focus-visible { outline: 3px solid #8ce8c4; outline-offset: 3px; }
    </style>
</head>
<body>
<main>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>Vous êtes hors connexion</h1>
    <p>PRO-SELLER ne peut pas joindre le serveur. Vérifiez votre connexion Internet, puis réessayez. Aucune donnée d’entreprise n’a été enregistrée sur cet appareil.</p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
</main>
</body>
</html>
